# SHO-815b: secret scan for the code repositories.
#
# The job name below is the status-check context. It is identical to the one the docs-style
# repositories use (SHO-815a), so one required-check name can be enforced everywhere.
#
# Scope: only the commits an event adds are scanned (the pull request range, or the pushed range on
# main), never `--all` history. Older history was scanned when it landed, and a full-history scan
# would turn every pull request red for a leak nobody on that pull request can fix.
#
# Gitleaks reads this repository's own `.gitleaks.toml` and `.gitleaksignore` from the checkout root
# when they exist, so existing allowlists keep applying.
#
# A finding is never dismissed here. For a verified false positive, add its fingerprint to a
# reviewed `.gitleaksignore`; for a real credential, rotate it first.
name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  # A newer pull request push supersedes the older one. A push to main is never cancelled or
  # replaced, because the next push's range starts after it and its commits would go unscanned.
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          set -euo pipefail
          readonly archive="gitleaks_8.30.1_linux_x64.tar.gz"
          readonly expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          readonly install_dir="${RUNNER_TEMP}/gitleaks-8.30.1"
          mkdir -p "${install_dir}"
          curl --fail --location --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" --output "${install_dir}/${archive}"
          printf '%s  %s\n' "${expected_sha256}" "${install_dir}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${install_dir}/${archive}" --directory "${install_dir}" gitleaks
          echo "GITLEAKS_BINARY=${install_dir}/gitleaks" >> "$GITHUB_ENV"
      - name: Prove the scanner detects a planted secret
        # A scanner that silently finds nothing would make every later run green. Build a disposable
        # repository, require a clean pass, then require the planted fake credential to be flagged.
        run: |
          set -euo pipefail
          control="$(mktemp -d "${RUNNER_TEMP}/scanner-control.XXXXXX")"
          report="${control}.json"
          control_git() {
            git -C "${control}" -c core.hooksPath=/dev/null -c commit.gpgsign=false -c user.name='Scanner control' -c user.email='ci@invalid.example' "$@"
          }
          scan_control() {
            "${GITLEAKS_BINARY}" git --no-banner --no-color --redact --report-format json --report-path "${report}" "${control}" > /dev/null 2>&1
          }
          control_git init --quiet
          printf 'Clean synthetic repository.\n' > "${control}/README.md"
          control_git add README.md
          control_git commit --quiet --message 'clean control'
          scan_control
          # Assembled at run time so no token-shaped string exists in this file or its history.
          printf 'credential=ghp_%s%s\n' 123456789012345678 AbCdEfGhIjKlMnOpQr > "${control}/canary.txt"
          control_git add canary.txt
          control_git commit --quiet --message 'synthetic detection control'
          if scan_control; then
            echo "::error::scanner control failed: the planted secret was not detected"
            exit 1
          fi
          jq -e 'length == 1 and .[0].RuleID == "github-pat"' "${report}" > /dev/null \
            || { echo "::error::scanner control failed: the scan did not report the planted secret"; exit 1; }
          echo "scanner control passed: a clean repository passes and the planted secret is detected (github-pat)"
      - name: Scan the commits this event adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          require_commit() {
            git cat-file -e "${1}^{commit}" 2> /dev/null \
              || { echo "::error::commit '${1}' is not in this checkout, so the range cannot be scanned"; exit 1; }
          }
          case "${EVENT_NAME}" in
            pull_request)
              require_commit "${PR_BASE_SHA}"
              require_commit "${PR_HEAD_SHA}"
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            push)
              require_commit "${PUSH_SHA}"
              if [[ "${PUSH_BEFORE}" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2> /dev/null; then
                # New branch, or a previous tip that is no longer reachable: scan everything the
                # pushed commit can reach instead of guessing which commits are new.
                range="${PUSH_SHA}"
              else
                range="${PUSH_BEFORE}..${PUSH_SHA}"
              fi
              ;;
            *)
              echo "::error::unsupported event '${EVENT_NAME}'"
              exit 1
              ;;
          esac
          echo "Scanning $(git rev-list --count "${range}") commit(s) in ${range}"
          if ! "${GITLEAKS_BINARY}" git --no-banner --no-color --redact --verbose --log-opts="${range}" .; then
            echo "::error::gitleaks reported a finding or could not complete the scan of ${range}. Rotate any real credential first; add a .gitleaksignore fingerprint only for a verified false positive."
            exit 1
          fi
